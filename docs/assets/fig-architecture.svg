<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="950" viewBox="0 0 1560 950" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1560" height="950" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#2f3b4d"/></marker><marker id="aro" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#1f6feb"/></marker></defs>
<text x="26" y="34" font-size="20" font-weight="700" fill="#1a2332" text-anchor="start">System architecture — where each responsibility lives</text>
<text x="26" y="58" font-size="13" font-weight="400" fill="#5a6676" text-anchor="start">The database is not a store behind the application. It is the application; the tiers above it carry no business rule.</text>
<rect x="26" y="96" width="1508" height="112" rx="6" fill="#f7f9fc" stroke="#2f3b4d" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#5a6676" text-anchor="start">PRESENTATION</text>
<text x="1532" y="88" font-size="11.5" font-weight="400" fill="#5a6676" text-anchor="end">Browser</text>
<rect x="26" y="260" width="1508" height="130" rx="6" fill="#f7f9fc" stroke="#2f3b4d" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="28" y="252" font-size="11.5" font-weight="700" fill="#5a6676" text-anchor="start">SERVICE</text>
<text x="1532" y="252" font-size="11.5" font-weight="400" fill="#5a6676" text-anchor="end">Python 3.13 / FastAPI</text>
<rect x="26" y="444" width="1508" height="128" rx="6" fill="#f7f9fc" stroke="#2f3b4d" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="28" y="436" font-size="11.5" font-weight="700" fill="#5a6676" text-anchor="start">ACCESS CONTROL</text>
<text x="1532" y="436" font-size="11.5" font-weight="400" fill="#5a6676" text-anchor="end">PostgreSQL roles, RLS, session identity</text>
<rect x="26" y="628" width="1508" height="262" rx="6" fill="#f7f9fc" stroke="#2f3b4d" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="28" y="620" font-size="11.5" font-weight="700" fill="#5a6676" text-anchor="start">DATA + LOGIC</text>
<text x="1532" y="620" font-size="11.5" font-weight="400" fill="#5a6676" text-anchor="end">PostgreSQL 16</text>
<rect x="46" y="108" width="300" height="88" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="59" y="133" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Trading terminal</text>
<text x="59" y="154" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Vanilla JS, no framework</text>
<text x="59" y="170" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Lightweight Charts, WebSocket feed</text>
<rect x="366" y="108" width="280" height="88" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="379" y="133" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Portfolio &amp; history</text>
<text x="379" y="154" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">NAV curve, blotter, ledger</text>
<text x="379" y="170" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Multi-currency switch</text>
<rect x="666" y="108" width="260" height="88" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="679" y="133" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Compliance console</text>
<text x="679" y="154" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Alert queue, invariants</text>
<text x="679" y="170" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">End-of-day batch</text>
<rect x="946" y="108" width="268" height="88" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="959" y="133" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Search &amp; markets</text>
<text x="959" y="154" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Trigram symbol search</text>
<text x="959" y="170" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Watchlists, price alerts</text>
<rect x="1234" y="108" width="280" height="88" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="1247" y="133" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Contract guard</text>
<text x="1247" y="154" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Compares API_CONTRACT</text>
<text x="1247" y="170" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Refuses a stale backend</text>
<rect x="46" y="284" width="420" height="106" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="59" y="309" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">REST API — 53 documented paths</text>
<text x="59" y="330" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Validation, JSON shaping, JWT issue/verify</text>
<text x="59" y="346" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Every write is one call to a database function</text>
<text x="59" y="362" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">No ORM: asyncpg speaks SQL directly</text>
<rect x="486" y="284" width="400" height="106" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="499" y="309" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">WebSocket fan-out</text>
<text x="499" y="330" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">LISTEN apex_events on a dedicated connection</text>
<text x="499" y="346" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">pg_notify from the engine reaches the browser</text>
<text x="499" y="362" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">without the browser ever polling</text>
<rect x="906" y="284" width="290" height="106" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="919" y="309" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Ingestion worker</text>
<text x="919" y="330" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Yahoo Finance adapter</text>
<text x="919" y="346" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Lazy per-symbol priming</text>
<text x="919" y="362" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Divergence guard before adopting a mark</text>
<rect x="1216" y="284" width="298" height="106" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="1229" y="309" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Health &amp; contract</text>
<text x="1229" y="330" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">/api/health exposes the 18 invariants</text>
<text x="1229" y="346" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">API_CONTRACT = 3</text>
<rect x="46" y="458" width="350" height="100" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="59" y="483" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">apex_app</text>
<text x="59" y="504" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">The role the API connects as</text>
<text x="59" y="520" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">No table ownership, so RLS binds</text>
<text x="59" y="536" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">apex.current_user_id set per request</text>
<rect x="416" y="458" width="350" height="100" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="429" y="483" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Row Level Security</text>
<text x="429" y="504" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Policies on user-facing tables</text>
<text x="429" y="520" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Views run security_invoker = true</text>
<text x="429" y="536" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">ops.assert_rls_intact() guards regression</text>
<rect x="786" y="458" width="360" height="100" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="799" y="483" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">apex_compliance</text>
<text x="799" y="504" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Sees every account</text>
<text x="799" y="520" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Escape hatch reads the role from the</text>
<text x="799" y="536" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">database, never from the client</text>
<rect x="1166" y="458" width="348" height="100" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="1179" y="483" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">Audit</text>
<text x="1179" y="504" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Before/after image per change</text>
<text x="1179" y="520" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">Append-only: UPDATE and DELETE</text>
<text x="1179" y="536" font-size="11" font-weight="400" fill="#5a6676" text-anchor="start">are rejected by trigger</text>
