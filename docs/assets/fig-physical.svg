<text x="26" y="34" font-size="20" font-weight="700" fill="#1a2332" text-anchor="start">Physical design — partitioning, indexing and the evidence for each</text>
<text x="26" y="58" font-size="13" font-weight="400" fill="#5a6676" text-anchor="start">Every claim below is produced by EXPLAIN ANALYZE in db/bench/explain.sql, not asserted.</text>
