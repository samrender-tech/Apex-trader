<rect x="1263.3333333333335" y="664" width="165.33333333333334" height="104" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="1346.0000000000002" y="706" font-size="22" font-weight="700" fill="#1f6feb" text-anchor="middle">24 / 16</text>
<text x="1346.0000000000002" y="730" font-size="11" font-weight="400" fill="#5a6676" text-anchor="middle">RLS policies</text>
