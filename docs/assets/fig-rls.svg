<text x="54" y="196" xml:space="preserve" font-size="14" font-weight="400" fill="#1f6feb" text-anchor="start" font-family="Consolas, monospace">SET apex.current_user_id = 342</text>
<text x="54" y="224" font-size="16" font-weight="700" fill="#1a2332" text-anchor="start">Samrender&#x27;s session</text>
<rect x="50" y="252" width="664" height="38" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="0.8"/>
<text x="66" y="277" xml:space="preserve" font-size="15" font-weight="700" fill="#1a2332" text-anchor="start" font-family="Consolas, monospace">V</text>
<text x="336" y="277" xml:space="preserve" font-size="14" font-weight="400" fill="#5a6676" text-anchor="end" font-family="Consolas, monospace">171.00</text>
<text x="636" y="277" xml:space="preserve" font-size="14" font-weight="400" fill="#5a6676" text-anchor="end" font-family="Consolas, monospace">51,057.18</text>
