<text x="26" y="36" font-size="22" font-weight="700" fill="#1a2332" text-anchor="start">Row Level Security — authorisation that a wrong query cannot bypass</text>
<text x="26" y="62" font-size="14" font-weight="400" fill="#5a6676" text-anchor="start">The same SQL text, two sessions, two answers. The restriction is on the table, not on the statement.</text>
<rect x="28" y="86" width="1444" height="52" rx="6" fill="#e8f0fe" stroke="#2f3b4d" stroke-width="1.8"/>
<text x="48" y="119" xml:space="preserve" font-size="16" font-weight="400" fill="#1a2332" text-anchor="start" font-family="Consolas, monospace">SELECT symbol, quantity, market_value FROM analytics.v_portfolio ORDER BY 3 DESC;</text>
