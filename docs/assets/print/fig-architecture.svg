<text x="24" y="112" font-size="13" font-weight="700" fill="#000000" text-anchor="start">PRESENTATION</text>
<rect x="24" y="120" width="992" height="124" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1016" y="112" font-size="13" font-weight="400" fill="#000000" text-anchor="end">Browser</text>
<rect x="38.0" y="134" width="312.0" height="96" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="52.0" y="162" font-size="16" font-weight="700" fill="#000000" text-anchor="start">Trading terminal</text>
<text x="52.0" y="186" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Charts, depth ladder,</text>
<text x="52.0" y="206" font-size="13" font-weight="400" fill="#000000" text-anchor="start">order ticket</text>
<rect x="364.0" y="134" width="312.0" height="96" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="378.0" y="162" font-size="16" font-weight="700" fill="#000000" text-anchor="start">Portfolio &amp; history</text>
<text x="378.0" y="186" font-size="13" font-weight="400" fill="#000000" text-anchor="start">NAV curve, blotter,</text>
<text x="378.0" y="206" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ledger, currencies</text>
<rect x="690.0" y="134" width="312.0" height="96" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="704.0" y="162" font-size="16" font-weight="700" fill="#000000" text-anchor="start">Compliance console</text>
<text x="704.0" y="186" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Alert queue, invariants,</text>
<text x="704.0" y="206" font-size="13" font-weight="400" fill="#000000" text-anchor="start">end-of-day batch</text>
<text x="24" y="282" font-size="13" font-weight="700" fill="#000000" text-anchor="start">SERVICE</text>
<rect x="24" y="290" width="992" height="134" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1016" y="282" font-size="13" font-weight="400" fill="#000000" text-anchor="end">Python 3.13 / FastAPI</text>
<rect x="38" y="304" width="475.0" height="106" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="52" y="332" font-size="16" font-weight="700" fill="#000000" text-anchor="start">REST API: 53 paths</text>
<text x="52" y="356" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Validation, JSON shaping, JWT</text>
<text x="52" y="376" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Every write is one call to a</text>
<text x="52" y="396" font-size="13" font-weight="400" fill="#000000" text-anchor="start">database function. No ORM.</text>
<rect x="527.0" y="304" width="475.0" height="106" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="541.0" y="332" font-size="16" font-weight="700" fill="#000000" text-anchor="start">WebSocket + worker</text>
<text x="541.0" y="356" font-size="13" font-weight="400" fill="#000000" text-anchor="start">LISTEN apex_events pushes a fill</text>
<text x="541.0" y="376" font-size="13" font-weight="400" fill="#000000" text-anchor="start">to the browser without polling.</text>
<text x="541.0" y="396" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Yahoo adapter ingests ticks.</text>
<text x="24" y="462" font-size="13" font-weight="700" fill="#000000" text-anchor="start">ACCESS CONTROL</text>
<rect x="24" y="470" width="992" height="134" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1016" y="462" font-size="13" font-weight="400" fill="#000000" text-anchor="end">PostgreSQL roles, RLS, session identity</text>
<rect x="38" y="484" width="475.0" height="106" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="52" y="512" font-size="16" font-weight="700" fill="#000000" text-anchor="start">apex_app</text>
<text x="52" y="536" font-size="13" font-weight="400" fill="#000000" text-anchor="start">The role the API connects as.</text>
<text x="52" y="556" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Owns no table, so RLS binds.</text>
<text x="52" y="576" font-size="13" font-weight="400" fill="#000000" text-anchor="start">apex.current_user_id per request</text>
<rect x="527.0" y="484" width="475.0" height="106" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="541.0" y="512" font-size="16" font-weight="700" fill="#000000" text-anchor="start">Policies and audit</text>
<text x="541.0" y="536" font-size="13" font-weight="400" fill="#000000" text-anchor="start">24 policies over 16 tables.</text>
<text x="541.0" y="556" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Views run security_invoker.</text>
<text x="541.0" y="576" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Every change is logged, append-only.</text>
<text x="24" y="642" font-size="13" font-weight="700" fill="#000000" text-anchor="start">DATA + LOGIC</text>
<rect x="24" y="650" width="992" height="450" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1016" y="642" font-size="13" font-weight="400" fill="#000000" text-anchor="end">PostgreSQL 16</text>
<rect x="38.0" y="664" width="312.0" height="92" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
