<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1010" viewBox="0 0 1040 1010" font-family="Times New Roman, Liberation Serif, serif">
<rect width="1040" height="1010" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#000000"/></marker><marker id="aro" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#000000"/></marker></defs>
<rect x="24" y="110" width="992" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<rect x="38" y="122" width="40" height="40" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="58" y="149" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">1</text>
<text x="94" y="142" xml:space="preserve" font-size="16.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">engine.submit_order</text>
<text x="94" y="168" font-size="13" font-weight="400" fill="#000000" text-anchor="start">account, instrument, side, kind, quantity, price</text>
<text x="94" y="194" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">Idempotency key checked first: a retried request cannot create a second order.</text>
<path d="M58,210 L58,226" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="24" y="226" width="992" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<rect x="38" y="238" width="40" height="40" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="58" y="265" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">2</text>
<text x="94" y="258" xml:space="preserve" font-size="16.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">engine.validate_order</text>
<text x="94" y="284" font-size="13" font-weight="400" fill="#000000" text-anchor="start">tick grid · lot size · price band · trading halt</text>
<text x="94" y="310" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">A price that is not a whole number of ticks is rejected before anything is written.</text>
<path d="M58,326 L58,342" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="24" y="342" width="992" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<rect x="38" y="354" width="40" height="40" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="58" y="381" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">3</text>
<text x="94" y="374" xml:space="preserve" font-size="16.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">risk.pretrade_check</text>
<text x="94" y="400" font-size="13" font-weight="400" fill="#000000" text-anchor="start">buying power · holdings · concentration · rate · daily loss</text>
<text x="94" y="426" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">Runs inside the order transaction, so no client path can route around it.</text>
<path d="M58,442 L58,458" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="24" y="458" width="992" height="100" rx="6" fill="#e4e4e4" stroke="#000000" stroke-width="1.8"/>
<rect x="38" y="470" width="40" height="40" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="58" y="497" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">4</text>
<text x="94" y="490" xml:space="preserve" font-size="16.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">pg_advisory_xact_lock</text>
<text x="94" y="516" font-size="13" font-weight="400" fill="#000000" text-anchor="start">hashtext(&#x27;apex_book&#x27;), instrument_id</text>
<text x="94" y="542" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">One book at a time. Different instruments never contend; the lock dies with the transaction.</text>
<path d="M58,558 L58,574" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="24" y="574" width="992" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<rect x="38" y="586" width="40" height="40" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="58" y="613" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">5</text>
<text x="94" y="606" xml:space="preserve" font-size="16.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">engine.match_order</text>
<text x="94" y="632" font-size="13" font-weight="400" fill="#000000" text-anchor="start">price-time priority, FOR UPDATE, never SKIP LOCKED</text>
<text x="94" y="658" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">ORDER BY limit_price, seq_no, served by a partial index, with no sort node.</text>
<path d="M58,674 L58,690" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="24" y="690" width="992" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<rect x="38" y="702" width="40" height="40" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="58" y="729" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">6</text>
<text x="94" y="722" xml:space="preserve" font-size="16.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">engine.settle_fill</text>
<text x="94" y="748" font-size="13" font-weight="400" fill="#000000" text-anchor="start">execution row + journal entry + position + quote</text>
<text x="94" y="774" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">Four writes, one unit. The position is a cache; the journal is the truth.</text>
<path d="M58,790 L58,806" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="24" y="806" width="992" height="100" rx="6" fill="#e4e4e4" stroke="#000000" stroke-width="1.8"/>
<rect x="38" y="818" width="40" height="40" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="58" y="845" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">7</text>
<text x="94" y="838" xml:space="preserve" font-size="16.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">COMMIT</text>
<text x="94" y="864" font-size="13" font-weight="400" fill="#000000" text-anchor="start">the deferred zero-sum constraint fires here</text>
<text x="94" y="890" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">If the entry does not balance, the COMMIT fails and all six earlier stages vanish.</text>
<rect x="24" y="928" width="992" height="76" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="958" font-size="17" font-weight="700" fill="#000000" text-anchor="start">ROLLBACK: any failure unwinds all seven</text>
<text x="42" y="984" font-size="13" font-weight="400" fill="#000000" text-anchor="start">The engine never leaves a half-matched order, an unsettled fill or an orphaned journal entry behind.</text>
</svg>