<text x="42" y="256" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">A one-day chart query reads ONE monthly partition.</text>
<text x="42" y="280" xml:space="preserve" font-size="13.5" font-weight="700" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">EXPLAIN ANALYZE: 1 partition opened, 10 pruned at plan time</text>
<text x="24" y="318" font-size="17" font-weight="700" fill="#000000" text-anchor="start">Measured latency: 60 warm iterations each, in-database</text>
<rect x="24" y="332" width="992" height="192" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="378" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Pre-trade risk check</text>
<rect x="344" y="362" width="136.28571428571428" height="22" rx="3" fill="#e4e4e4" stroke="#000000" stroke-width="1.8"/>
<text x="490.2857142857143" y="379" font-size="13.5" font-weight="700" fill="#000000" text-anchor="start">1.06 ms</text>
<text x="42" y="414" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Order that rests, no fill</text>
<rect x="344" y="398" width="320.14285714285717" height="22" rx="3" fill="#e4e4e4" stroke="#000000" stroke-width="1.8"/>
<text x="674.1428571428571" y="415" font-size="13.5" font-weight="700" fill="#000000" text-anchor="start">2.49 ms</text>
<text x="42" y="450" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Market order: match + settle</text>
<rect x="344" y="434" width="477.0" height="22" rx="3" fill="#e4e4e4" stroke="#000000" stroke-width="1.8"/>
<text x="831.0" y="451" font-size="13.5" font-weight="700" fill="#000000" text-anchor="start">3.71 ms</text>
<text x="42" y="492" font-size="13" font-weight="400" fill="#000000" text-anchor="start">A market order does validation, risk, the lock, the match, the execution row, the journal</text>
<text x="42" y="512" font-size="13" font-weight="400" fill="#000000" text-anchor="start">entry and the position update, all of it in 3.71 ms.</text>
<text x="24" y="556" font-size="17" font-weight="700" fill="#000000" text-anchor="start">Index strategy: one type per access pattern</text>
<rect x="24" y="570" width="992" height="70" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="593" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">B-tree composite</text>
<text x="42" y="612" xml:space="preserve" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">trade_order(instrument_id, side, limit_price, seq_no)</text>
<text x="42" y="631" font-size="12" font-weight="400" fill="#000000" text-anchor="start">The order book IS this index. Matching reads it in order, so no sort node appears.</text>
<rect x="24" y="644" width="992" height="70" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="667" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">BRIN</text>
<text x="42" y="686" xml:space="preserve" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">tick(ts), candle_1m(bucket_start)</text>
<text x="42" y="705" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Append-only time series: 24 kB against 4,248 kB for an equivalent B-tree.</text>
<rect x="24" y="718" width="992" height="70" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="741" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">Partial</text>
<text x="42" y="760" xml:space="preserve" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">trade_order WHERE status IN (&#x27;working&#x27;,&#x27;partially_filled&#x27;)</text>
<text x="42" y="779" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Only live orders are ever matched against; the index excludes the 90% that are done.</text>
<rect x="24" y="792" width="992" height="70" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="815" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">GIN + trigram</text>
<text x="42" y="834" xml:space="preserve" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">instrument USING gin (name gin_trgm_ops)</text>
<text x="42" y="853" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Fuzzy search: &quot;aple&quot; finds AAPL. An exact-match B-tree cannot do this at all.</text>
<rect x="24" y="866" width="992" height="70" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="889" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">Covering (INCLUDE)</text>
<text x="42" y="908" xml:space="preserve" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">position(account_id) INCLUDE (quantity, avg_cost)</text>
<text x="42" y="927" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Index-only scan: the heap is never touched, so there are zero heap fetches.</text>
<rect x="24" y="940" width="992" height="70" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="42" y="963" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">GiST (btree_gist)</text>
<text x="42" y="982" xml:space="preserve" font-size="11" font-weight="400" fill="#000000" text-anchor="start" font-family="Courier New, Liberation Mono, monospace">EXCLUDE on risk.trading_halt</text>
<text x="42" y="1001" font-size="12" font-weight="400" fill="#000000" text-anchor="start">Two halts on one instrument cannot overlap in time, a race condition removed.</text>
<text x="24" y="1038" font-size="17" font-weight="700" fill="#000000" text-anchor="start">Scale of the physical design</text>
<rect x="24.0" y="1052" width="103.11111111111111" height="78" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
