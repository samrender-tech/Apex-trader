<text x="520.0" y="1086" font-size="19" font-weight="700" fill="#000000" text-anchor="middle">84</text>
<text x="520.0" y="1110" font-size="10.5" font-weight="400" fill="#000000" text-anchor="middle">routines</text>
<rect x="579.5555555555555" y="1052" width="103.11111111111111" height="78" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
<text x="631.1111111111111" y="1086" font-size="19" font-weight="700" fill="#000000" text-anchor="middle">40</text>
<text x="631.1111111111111" y="1110" font-size="10.5" font-weight="400" fill="#000000" text-anchor="middle">triggers</text>
<rect x="690.6666666666667" y="1052" width="103.11111111111111" height="78" rx="6" fill="#f2f2f2" stroke="#000000" stroke-width="1.8"/>
